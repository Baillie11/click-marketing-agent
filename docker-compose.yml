services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: click_marketing_agent
      MARIADB_USER: click
      MARIADB_PASSWORD: click
      MARIADB_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: [click-db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  click-db:

